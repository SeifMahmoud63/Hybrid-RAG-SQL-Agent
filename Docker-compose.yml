services:
  api:
    build: .
    container_name: fastapi_service
    ports:
      - "8000:80"
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant_service
    depends_on:
      - qdrant
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: postgres_service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: seifmahmoud
      POSTGRES_DB: ai_trail_by_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_service
    ports:
      - "6333:6333" # REST API & Dashboard
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped


volumes:
  qdrant_data:
  postgres_data: